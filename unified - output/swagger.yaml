openapi: 3.0.2
info:
  title: Unified SAFIS API -Test
  description: "**Overview**\n\nThis API is used by remote applications   to communicate\
    \ with the SAFIS backend database server. It is not intended for any other purpose.\
    \ This document is intended as a programmer’s reference manual. It is used by\
    \ both application developers who build a front-end, and the programmers who maintain\
    \ this   API back-end. \n\nTo request an API key, please contact us. "
  contact:
    email: support@accsp.org
  version: 1.0.71
  x-logo:
    url: https://raw.githubusercontent.com/accsp-software/spec-unified-api-test/master/docs/accsp_logo.jpg
servers:
- url: https://safis.accsp.org/safis_test/safist/api
  description: ""
tags:
- name: eTrips
  description: eTrips
- name: eDR
  description: eDR
paths:
  /user_permits:
    post:
      tags:
      - eTrips
      - eDR
      summary: user_permits
      description: "This call retrieves a list of fisher or dealer permits for the\
        \ logged in user with a valid username, password and API key."
      requestBody:
        description: ""
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/user_permits_request"
            examples:
              fisher_permit_request:
                value:
                  p_usertype: FISHER
        required: true
      responses:
        "200":
          description: successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/user_permits_response"
              examples:
                "2_license_example":
                  value:
                    row:
                    - license_nbr: MAFISHER
                      license_type: Commercial Fisher
                      permit_type: Commercial
                      agency: "0003"
                      in_use: "Y"
                    - license_nbr: MAFISHER2
                      license_type: For-hire
                      permit_type: For-Hire
                      agency: "0003"
                      in_use: "Y"
                    status: OK
                    description: "User: Active Permit Count:0"
      security:
      - Confidential-API: []
  /trips_download:
    post:
      tags:
      - eTrips
      summary: trips_download
      description: "retrieve set of trips rows from safis. \nA list of trips is requested\
        \ from the SAFIS system within the upper and lower limits of the start and\
        \ end dates (inclusive) . This list will only contain successfully uploaded\
        \ trips and will be sent to same format as the trips_upload call. "
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/trips_download_request"
        required: true
      responses:
        "200":
          description: output of the endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/trips_download_response"
  /lookup_list_date_changed:
    post:
      tags:
      - eTrips
      - eDR
      summary: lookup_list_date_changed
      description: fetch the last date that the specified lookup table(s) were changed.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/lookup_list_date_changed_request"
        required: true
      responses:
        "200":
          description: output of the endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/lookup_list_date_changed_response"
      security:
      - Non-Confidential: []
  /neg_reports_upload:
    post:
      tags:
      - eDR
      summary: 'neg_reports_upload '
      description: Send a set of negative dealer reports to safis. They can be sent
        as single records (with no end date). Or as a range (including an end date)
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/neg_dealer_reports"
        required: true
      responses:
        "200":
          description: output of the endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/neg_dealer_reports_response"
      security:
      - Confidential-API: []
  /neg_reports_upload_errors:
    post:
      tags:
      - eDR
      summary: 'neg_reports_upload_errors '
      description: 'Fetch a list of errors from a neg_reports_upload attempt that
        did not load. '
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/event_id"
        required: true
      responses:
        "200":
          description: output of the endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/neg_dealer_reports_error_response"
      security:
      - Confidential-API: []
  /neg_trips_upload_errors:
    post:
      tags:
      - eTrips
      summary: 'neg_trips_upload_errors '
      description: fetch a list of errors from negative/did not fish reports that
        didn’t load after calling neg_trips_upload.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/event_id"
        required: true
      responses:
        "200":
          description: output of the endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/neg_trips_error_response"
      security:
      - Confidential-API: []
  /participants:
    post:
      tags:
      - eTrips
      summary: 'participants '
      description: "Check for/update users with the given information.\nThis call\
        \ retrieves a list of participants in the SAFIS system with the supplier user\
        \ identifiable information. \n"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/participants"
        required: true
      responses:
        "200":
          description: output of the endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/participants_response"
      security:
      - Confidential-API: []
  /permit_compliance:
    post:
      tags:
      - eDR
      summary: 'permit_compliance '
      description: checks the current compliance status of a dealer permit
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/permit_compliance_request"
      responses:
        "200":
          description: output of the endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/permit_compliance_response"
      security:
      - Confidential-API: []
  /permit_endorsements:
    post:
      tags:
      - eDR
      summary: 'permit_endorsements '
      description: fetch a list of endorsements for a given a partner
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/permit_endorsements_request"
        required: true
      responses:
        "200":
          description: output of the endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/permit_endorsements_responses"
      security:
      - Confidential-API: []
  /reports_upload:
    post:
      tags:
      - eDR
      summary: 'reports_upload '
      description: 'Upload an array of dealer reports including associated landings '
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/dealer_reports_upload_request"
        required: true
      responses:
        "200":
          description: output of the endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/dealer_reports_response"
      security:
      - Confidential-API: []
  /reports_upload_errors:
    post:
      tags:
      - eDR
      summary: 'reports_upload_errors '
      description: 'Fetch a list of errors from a dealer reports_upload attempt that
        did not load. '
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/event_id"
        required: true
      responses:
        "200":
          description: output of the endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/dealer_reports_error_response"
      security:
      - Confidential-API: []
  /trips_upload_errors:
    post:
      tags:
      - eTrips
      summary: trips_upload_errors
      description: fetch a list of errors from trip rows that did not load. Should
        be called after trips_upload call if one or moreerrored records are indicated
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/event_id"
        required: true
      responses:
        "200":
          description: output of the endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/trip_upload_error_response"
      security:
      - Confidential-API: []
  /lookup_list_by_attribute:
    post:
      tags:
      - eTrips
      summary: lookup_list_by_attribute
      description: fetch a set of rows for specified attribute lookup list. Used in
        combination with _additional_attributes lookup_list
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/lookup_list_attribute_request"
        required: true
      responses:
        "200":
          description: output of the endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/lookup_list_attribute_response"
      security:
      - Non-Confidential: []
  /notification_upload:
    summary: submits trip notification and returns universal trip ID
    description: "The calling app sends a notification record in JSON format.  The\
      \ record consists of core notification details submitted as parameter values,\
      \ and optional partner-managed notification attributes submitted as a JSON array.\
      \  See example request.  \r\nThe response, also in JSON format, includes the\
      \ universal trip ID for the trip.  The universal trip ID is created when a notification\
      \ record is submitted if this is the first notification associated with the\
      \ trip.  If an existing universal trip ID already exists for the same trip,\
      \ the previously generated universal trip ID is returned.  \r\n"
    post:
      tags:
      - eTrips
      summary: notification_upload
      description: "The calling app sends a notification record in JSON format.  The\
        \ record consists of core notification details submitted as parameter values,\
        \ and optional partner-managed notification attributes submitted as a JSON\
        \ array.  See example request.  The response, also in JSON format, includes\
        \ the universal trip ID for the trip.  The universal trip ID is created when\
        \ a notification record is submitted if this is the first notification associated\
        \ with the trip.  If an existing universal trip ID already exists for the\
        \ same trip, the previously generated universal trip ID is returned.  \r\n"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/notification_upload_request"
        required: true
      responses:
        "200":
          description: A HTTP status code 200/OK refers to the status of the HTTP
            request and does not indicate whether or not ACCSP data validations were
            successful. Data validation errors are generated during record processing
            and are returned as “errors” in the response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/notification_upload_response"
      security:
      - Confidential-API: []
  /neg_trips_not_processed:
    post:
      tags:
      - eTrips
      summary: neg_trips_not_processed
      description: This endpoint provides a list of negative (did not fish) trips
        submitted under the provided license (p_license_nbr) which either 1) did not
        fully process after being received by the ACCSP or 2) processed successfully
        but were subsequently deleted by a partner administrator.
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/neg_trips_download_request"
        required: true
      responses:
        "200":
          description: output of the endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/neg_trips_download_response"
  /trip_locations:
    post:
      tags:
      - eTrips
      summary: trip_locations
      description: "This endpoint is used to send a set of trip locations to SAFIS.\
        \ Records in the locations array should include a timestamp in UTC format.\
        \ The ACCSP API expects a 'Z' or Zulu offset (e.g. 2021-11-26T18:31:30Z) and\
        \ timestamps submitted without a time offset will be interpreted as not having\
        \ one. Location records should also include latitude and longitude (5-decimal\
        \ precision) within the range 20 to 50 and -100 to -60, respectively. See\
        \ Request Sample. A vessel coast number or state registration number is required,\
        \ if both values are sent the coast guard number will be used to validate\
        \ the vessel."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/locations"
        required: true
      responses:
        "200":
          description: A HTTP status code 200/OK refers to the status of the HTTP
            request and does not indicate whether or not ACCSP data validations were
            successful. Data validation errors are generated during record processing
            and are returned as “errors” in the response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/trip_locations_response"
      security:
      - Confidential-API: []
  /trips_upload:
    post:
      tags:
      - eTrips
      summary: 'trips_upload '
      description: send a set of trips rows to safis using the request showen a trip
        submission that include three gear attributes. Resubmissions of trips previously
        submitted and processed successfully should include the accsp_trip_id (provided
        in response for successful submissions) and a trip_update flag (set value
        to Y). See example request.
      parameters:
      - name: AppVersion
        in: header
        required: true
        style: simple
        explode: false
        schema:
          type: string
        example: "AppVersion : 2.2.11232"
      - name: Platform
        in: header
        required: false
        style: simple
        explode: false
        schema:
          type: string
        example: "Platform : iOS"
      - name: AppName
        in: header
        required: false
        style: simple
        explode: false
        schema:
          type: string
        example: "AppName : ETRIPS"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/trips"
        required: true
      responses:
        "200":
          description: A HTTP status code 200/OK refers to the status of the HTTP
            request and does not indicate whether or not ACCSP data validations were
            successful. Data validation errors are generated during record processing
            and are returned as “errors” in the response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/trip_upload_response"
      security:
      - Confidential-API: []
  /lookup_list:
    post:
      tags:
      - eTrips
      - eDR
      summary: lookup_list
      description: "fetch a set of rows for a specified lookup table.\n\nAll lists\
        \ accept the p_partner parameter and are partner specific with the exception\
        \ of VESSELS, PORTS, USER_NOTIFICATIONS, VMS_LANDING_LOCATIONS, SCIFISH_SPECIES\
        \ AND SCIFISH_TRIP_ACTIVITY,TRIP_PROCESSED,HMS_TARGET_SPECIES,HMS_GEARS,PARTNER_MANAGED_FOOTER.\n\
        All vessels returned are federally permitted vessels. "
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/lookup_list_request"
        required: true
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/lookup_list_responses"
      security:
      - Non-Confidential: []
  /neg_trips_upload:
    post:
      tags:
      - eTrips
      summary: 'neg_trips_upload '
      description: "The neg_trips_upload endpoint accepts multiple reports within\
        \ a single API call (see example request).  However, to avoid unexpected validation\
        \ failures we recommend sending reports from the same fishing license, participant\
        \ and vessel within individual API calls.  Including different fishing licenses\
        \ or vessels within a single API call may result in unexpected validation\
        \ failures and misleading errors. the sector payload is a required value for\
        \ SERO partners."
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/neg_trips"
        required: true
      responses:
        "200":
          description: A HTTP status code 200/OK refers to the status of the HTTP
            request and does not indicate whether or not ACCSP data validations were
            successful. Data validation errors are generated during record processing
            and are returned as “errors” in the response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/neg_trips_response"
      security:
      - Confidential-API: []
components:
  schemas:
    user_permits_request:
      title: Root Type for user_permits_request
      required:
      - p_usertype
      type: object
      properties:
        p_usertype:
          type: string
          enum:
          - FISHER
          - DEALER
      description: ""
      example:
        p_usertype: FISHER
    trips:
      required:
      - trips
      type: object
      properties:
        trips:
          type: array
          description: collection of trips
          items:
            $ref: "#/components/schemas/trip"
      description: 'collection of trip objects. '
    neg_trips_response:
      title: Root Type for neg_trips_response
      required:
      - status
      type: object
      properties:
        row:
          type: array
          items:
            type: object
            properties:
              event_id:
                type: string
                description: the unique job-id/event_id for this upload assigned by
                  the system
              upload_date:
                type: string
                description: when the upload was received
                format: date-time
              process_date:
                type: string
                description: When the upload was processed.
              total_count:
                type: string
                description: total count of neg trip records received.
              errored_count:
                type: string
                description: total count of neg trip records that were not processed
                  due to one or more errors.
        status:
          type: string
          description: status of the upload attempt
          enum:
          - OK
          - FAIL
        description:
          type: string
          description: Human readable description of the status reason or failure
      description: ""
      example:
        row:
        - event_id: "765841"
          upload_date: 2020-04-16 15:12:14
          process_date: 54735
          total_count: "2"
          errored_count: "1"
        status: OK
        description: Total rows inserted 2
    lookup_list_attribute_request:
      title: Root Type for lookup_list_attribute_request
      required:
      - p_attribute
      - p_partner
      type: object
      properties:
        p_partner:
          type: string
          description: 4 character issuing agency of the attributes list
        p_attribute:
          type: string
          description: attribute code corresponding to attribute_code given by lookup_list
        p_lastdate:
          type: string
          description: the earliest date filter for the list request. Format MM/DD/YYYY
            hh24:mi:ss
          format: date-time
      description: ""
      example:
        p_partner: "0018"
        p_attribute: "403"
        p_lastdate: '12/27/2010 14:45:00 '
    lookup_list_attribute_response:
      title: Root Type for lookup_list_attribute_response
      required:
      - status
      type: object
      properties:
        row:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                description: return value for this element
              desc:
                type: string
                description: display value of element
              comm_flag:
                type: string
                description: indicator flag for whether element is needed for Commercial
                  Trip.
              for_hire_charter_flag:
                type: string
                description: indicator flag for whether element is needed for For-Hire
                  Charter Trip.
              for_hire_hb_flag:
                type: string
                description: indicator flag for whether element is needed for For-Hire
                  Headboat Trip.
              rec_flag:
                type: string
                description: indicator flag for whether element is needed for Recreational
                  Trip.
        status:
          type: string
          description: status of the upload attempt
          enum:
          - OK
          - FAIL
        description:
          type: string
          description: Human readable description of the status reason or failure.
      description: ""
      example:
        row:
        - code: "031"
          desc: "PURSE SEINE, TARP"
          comm_flag: R
          for_hire_charter_flag: "N"
          for_hire_hb_flag: "N"
          rec_flag: "N"
        - code: "093"
          desc: "OTTER TRAWL BOTTOM, LOBSTER"
          comm_flag: "Y"
          for_hire_charter_flag: "N"
          for_hire_hb_flag: "N"
          rec_flag: "N"
        status: OK
        description: Attribute(s) Found
    lookup_list_date_changed_response:
      title: Root Type for lookup_list_date_changed_response
      required:
      - status
      type: object
      properties:
        row:
          type: array
          description: lookup_lists requested
          items:
            type: object
            properties:
              list:
                type: string
                description: listname from p_listnames
              last_date:
                type: string
                description: last modified date of requested list. Format MM/DD/YYYY
                  hh24:mi:ss
                format: date
        status:
          type: string
          description: status of the request
          enum:
          - OK
          - FAIL
        description:
          type: string
          description: Human readable description of the status reason or failure.
      description: ""
      example:
        row:
        - list: GEARS
          last_date: 09/26/2018 16:55:04
        - list: VESSELS
          last_date: 09/01/2016 12:44:01
        status: OK
        description: Date(s) Found
    event_id:
      title: Root Type for event_id
      required:
      - p_event_id
      type: object
      properties:
        p_event_id:
          type: string
          description: 'Event id passed back by server in previous upload request. '
      description: ""
      example:
        p_event_id: "54321"
    trip_upload_error_response:
      title: Root Type for trip_upload_error_response
      type: object
      properties:
        row:
          type: array
          items:
            $ref: "#/components/schemas/trip_upload_error"
        status:
          type: string
          description: status of the request attempt
          enum:
          - OK
          - FAIL
        description:
          type: string
          description: Human readable description of the status reason or failure.
      description: ""
      example:
        row: []
        status: OK
        description: Total Errors 1
    trip_upload_error:
      title: Root Type for trips_upload_error
      required:
      - ERR_DESC
      type: object
      properties:
        ERR_DESC:
          type: string
          description: Human readable description of error.
        SUPPLIER_TRIP_ID:
          type: string
          description: 'supplier_trip_id of record with error. Only shown when error
            is at trip level. '
        SUPPLIER_EFFORT_ID:
          type: string
          description: 'supplier_effort_id of record with error. Only shown when error
            is at effort level. '
        SUPPLIER_CATCH_ID:
          type: string
          description: 'supplier_catch_id of record with error. Only shown when error
            is at catch level. '
        EVENT_ID:
          type: string
          description: 'the event id of error returned. '
      description: ""
      example:
        ERR_DESC: Date Sold is not in the correct format (MM/DD/YYYY)
        SUPPLIER_TRIP_ID: "052620093047881"
        SUPPLIER_EFFORT_ID: "052620093047882"
        SUPPLIER_CATCH_ID: "052620093047883"
        EVENT_ID: "807053"
    participants:
      required:
      - participants
      type: object
      properties:
        participants:
          type: array
          description: ""
          items:
            $ref: "#/components/schemas/participant"
      description: ""
    participants_response:
      title: Root Type for participants_response
      type: object
      properties:
        participants:
          type: array
          items:
            type: object
            properties:
              supplier_user_id:
                type: string
                description: unique record id given in the payload.
              safis_participant_id:
                type: integer
                description: SAFIS system participant id of the given user. Required
                  in trips_upload API if downloading records without username.
                format: int32
              safis_license_nbr:
                type: string
                description: License Number stored in the SAFIS system for this user's
                  record.
              issuing_agency:
                type: string
                description: 4 character id of license issuing agency.
        errors:
          type: array
          description: all errors encountered in the upload attempt
          items:
            type: object
            properties:
              supplier_user_id:
                type: string
                description: unique record id given in the payload
              messages:
                type: array
                items:
                  type: string
                  description: individual error message descriptions
        status:
          type: string
          description: status of the upload attempt
          enum:
          - OK
          - FAIL
        processed:
          type: integer
          description: number of participant records processed
          format: int32
        description:
          type: string
          description: human readable explanation of the request attempt result
      description: 'participants response combines succesful trip information and
        errors. '
      example:
        participants:
        - supplier_user_id: "1111"
          safis_participant_id: 196973
          safis_license_nbr: "1111"
          issuing_agency: "0018"
        errors:
        - supplier_user_id: "1112"
          messages:
          - Phone Number is not in the right format
          - Birth Date Value is not valid.
        status: OK
        processed: 2
        description: "Rows processed: 2 Event_id: 815428"
    user_permits_response:
      type: object
      properties:
        row:
          type: array
          items:
            type: object
            properties:
              license_nbr:
                type: string
                description: Permit/License number given by the issuing agency
              license_type:
                type: string
                description: License type as defined by the issuing agency
              permit_type:
                type: string
                description: Permit type as defined by ACCSP.
                enum:
                - For-Hire
