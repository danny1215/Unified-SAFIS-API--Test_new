    trip_activity_response:
      title: TRIP_ACTIVITY
      type: object
      description: Provides a list of trip activity types for a given partner (p_partner).
        List types for older applications and versions are available by specifying
        a listtype using the p_listtype parameter (e.g. p_listtype = "ETRIPS").
      example:
        activity_type: 1
        activity_description: Set only trip
        comm_flag: "Y"
        for_hire_charter_flag: "Y"
        for_hire_hb_flag: "Y"
        rec_flag: "N"
        status: "Y"
    catch:
      title: Catch
      required:
      - catch_source
      - disposition
      - grade_code
      - market_code
      - reported_quantity
      - species_itis
      - supplier_catch_id
      - unit_of_measure
      type: object
      properties:
        species_itis:
          type: string
          description: ITIS code of the fish caught
        disposition:
          type: string
          description: The final disposition or fate of the catch.
        unit_of_measure:
          type: string
          description: Code for unit of measure used to reference the reported_quantity
            field
        market_code:
          type: string
          description: Factors affecting market price (such as size).
        grade_code:
          type: string
          description: "Grade, or how catch was processed."
        reported_quantity:
          type: string
          description: 'Numeric quantity of fish caught. Always used in conjunction
            with unit_of_measure field. '
        nbr_of_fish:
          type: string
          description: Count of fish caught
        supplier_catch_id:
          type: string
          description: Unique catch id given by the caller. Only used to communicate
            errors and for updates.
        catch_source:
          type: string
          description: Source of a fisher’s catch (S = Standard wild-caught; A = Aquaculture;
            R = Research Set Aside; C = Carred).
          enum:
          - S
          - A
          - R
          - C
        sale_disposition_flag:
          type: string
          description: "Code indicating whether catch was sold, kept, or discarded."
        catch_additional_attributes:
          type: array
          description: Collection of supplemental attributes defining the catch.
          items:
            $ref: "#/components/schemas/attribute"
        sale_disposition_attributes:
          type: array
          description: Collection of supplemental attributes defining the sale.
          items:
            $ref: "#/components/schemas/attribute"
        species_attributes:
          type: array
          description: Collection of species-specific supplemental attributes defining
            the catch.
          items:
            $ref: "#/components/schemas/attribute"
      description: ""
      example:
        species_itis: "170425"
        disposition: "001"
        unit_of_measure: LB
        market_code: UN
        grade_code: "01"
        reported_quantity: "25"
        nbr_of_fish: "4"
        catch_source: S
        supplier_catch_id: "6"
    gears_list_response:
      title: GEARS
      type: object
      properties:
        row:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
                description: gear code. Returned by the upload requests where gear
                  is requested.
              desc:
                type: string
                description: gear name.
              category_code:
                type: string
                description: gear category code
              category_name:
                type: string
                description: gear category description
              comm_flag:
                type: string
                description: "indicates if attribute is required (R), optional (Y)\
                  \ or Not displayed (N) in commercial trip"
                enum:
                - R
                - "Y"
                - "N"
              for_hire_ch_flag:
                type: string
                description: "indicates if attribute is required (R), optional (Y)\
                  \ or Not displayed (N) in for-hire charter trip"
                enum:
                - R
                - "Y"
                - "N"
              for_hire_hb_flag:
                type: string
                description: "indicates if attribute is required (R), optional (Y)\
                  \ or Not displayed (N) in for-hire headboat trip"
                enum:
                - R
                - "Y"
                - "N"
              rec_flag:
                type: string
                description: "indicates if attribute is required (R), optional (Y)\
                  \ or Not displayed (N) in recreational trip"
                enum:
                - R
                - "Y"
                - "N"
              status:
                type: string
                description: "indicates if attribute is active (A), inactive (I)"
                enum:
                - A
                - I
        status:
          type: string
          description: status of the request
          enum:
          - OK
          - FAIL
        description:
          type: string
          description: human readable description of the result status
      description: GEARS
      example:
        row:
        - code: "077"
          desc: HOOP NET
          category_code: "070"
          category_name: OTHER FIXED NETS
          comm_flag: "Y"
          for_hire_ch_flag: "N"
          for_hire_hb_flag: "N"
          rec_flag: "N"
          status: A
          type: "Number(10,3)"
        - code: "407"
          desc: "LONG LINES, DRIFT W/HOOKS"
          category_code: "400"
          category_name: LONG LINES
          comm_flag: "Y"
          for_hire_ch_flag: "N"
          for_hire_hb_flag: "N"
          rec_flag: "N"
          status: A
          type: "Number(10,3)"
        status: OK
        description: 2 Gear(s) Returned
